<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Tipo de Serviço</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:#f5f7fb;
            font-family:'Inter', sans-serif;
            padding:40px;
        }

        .container{
            max-width:650px;
            margin:auto;
            background:white;
            padding:40px;
            border-radius:20px;
            box-shadow:0 4px 14px rgba(0,0,0,0.08);
        }

        h1{
            margin-bottom:30px;
            color:#111827;
        }

        .grupo{
            margin-bottom:22px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-weight:600;
            color:#374151;
        }

        input, textarea{
            width:100%;
            padding:14px;
            border:1px solid #d1d5db;
            border-radius:12px;
            font-size:15px;
        }

        textarea{
            resize:none;
            height:120px;
        }

        input:focus,
        textarea:focus{
            outline:none;
            border-color:#2563eb;
        }

        button{
            width:100%;
            padding:16px;
            border:none;
            border-radius:12px;
            background:#2563eb;
            color:white;
            font-size:16px;
            font-weight:600;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#1d4ed8;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Cadastro de Tipo de Serviço</h1>

        <form action="/salvar_tipo_servico" method="POST">

            <div class="grupo">
                <label>Nome do Serviço</label>
                <input type="text" name="nome_servico" required>
            </div>

            <div class="grupo">
                <label>Descrição</label>
                <textarea name="descricao"></textarea>
            </div>

            <button type="submit">
                Salvar Tipo de Serviço
            </button>

        </form>

    </div>

</body>

</html>
